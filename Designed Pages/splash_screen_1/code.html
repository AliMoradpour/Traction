<style>
        body {
            background-color: #0F172A;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtle ambient glow effect */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, rgba(15, 23, 42, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Entrance animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-entrance {
            animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.3s; opacity: 0; }

        /* Custom Logo Mark Styling */
        .logo-mark {
            width: 48px;
            height: 48px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-shape {
            width: 100%;
            height: 100%;
            border: 3.5px solid #FFFFFF;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .logo-inner {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 60%;
            height: 60%;
            background-color: #3B82F6;
            border-top-right-radius: 8px;
        }
    </style>

<body class="flex flex-col items-center justify-center min-h-screen selection:bg-primary/30">
<!-- Ambient background layer -->
<div class="ambient-glow"></div>
<!-- Main Content Container -->
<main class="relative z-10 flex flex-col items-center gap-xl">
<!-- Logo Cluster -->
<div class="flex flex-col items-center gap-6">
<!-- Branding Mark -->
<div class="animate-entrance stagger-1">
<div class="logo-mark">
<div class="logo-shape">
<div class="logo-inner"></div>
</div>
</div>
</div>
<!-- Brand Name -->
<div class="animate-entrance stagger-2">
<h1 class="font-display-lg text-display-lg text-white tracking-tight">
                    Traction
                </h1>
</div>
</div>
</main>
<!-- Bottom Indicator (Minimalist) -->
<div class="fixed bottom-12 left-0 w-full flex justify-center animate-entrance stagger-2" style="animation-delay: 0.8s; opacity: 0;">
<div class="w-1.5 h-1.5 rounded-full bg-white/20 animate-pulse"></div>
</div>
<!-- Script for subtle mouse tracking glow (Desktop only) -->
<script>
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.ambient-glow');
            if (glow) {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.05;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.05;
                glow.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
            }
        });

        // Auto-transition logic placeholder
