<script>
        // Timer Logic
        let timeLeft = 25 * 60; // 25 minutes
        const timerText = document.getElementById('timer-text');
        const timerRing = document.getElementById('timer-ring');
        const totalLength = 1193.8; // Approximate circumference for r=190

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Update Ring
            const progress = timeLeft / (25 * 60);
            const offset = totalLength * (1 - progress);
            timerRing.style.strokeDashoffset = offset;

            if (timeLeft > 0) {
                timeLeft--;
            } else {
                clearInterval(timerInterval);
            }
        }

        const timerInterval = setInterval(updateTimer, 1000);
        updateTimer();

        // Interaction Logic
        function handleComplete() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100', 'pointer-events-auto');
            
            // Haptic style subtle shake on main content before transition
            document.querySelector('main').style.transform = 'scale(0.95)';
            document.querySelector('main').style.filter = 'blur(20px)';
            document.querySelector('main').style.transition = 'all 0.8s ease-in-out';
        }

        // Handle Dark Mode simulation if needed
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // Detect if dark mode was intended (though light mode is priority)
        // If system prefers dark, allow for seamless transition if classes are added
    </script>
