<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Traction - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#bec6e0",
                    "inverse-surface": "#303032",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#fcf8fa",
                    "tertiary-fixed-dim": "#dec29a",
                    "surface-tint": "#565e74",
                    "surface-container-high": "#eae7e9",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary": "#515f74",
                    "primary-fixed": "#dae2fd",
                    "on-surface-variant": "#45464d",
                    "on-tertiary-container": "#98805d",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "secondary-fixed-dim": "#b9c7e0",
                    "outline": "#76777d",
                    "surface-dim": "#dcd9db",
                    "surface-container-highest": "#e4e2e4",
                    "surface-container": "#f0edef",
                    "secondary-fixed": "#d5e3fd",
                    "on-primary-container": "#7c839b",
                    "primary": "#000000",
                    "on-error-container": "#93000a",
                    "surface-variant": "#e4e2e4",
                    "on-primary-fixed-variant": "#3f465c",
                    "surface-container-low": "#f6f3f5",
                    "on-secondary-container": "#57657b",
                    "tertiary-container": "#271901",
                    "on-background": "#1b1b1d",
                    "on-secondary-fixed": "#0d1c2f",
                    "primary-container": "#131b2e",
                    "on-error": "#ffffff",
                    "tertiary": "#000000",
                    "on-surface": "#1b1b1d",
                    "on-secondary-fixed-variant": "#3a485c",
                    "inverse-on-surface": "#f3f0f2",
                    "background": "#fcf8fa",
                    "tertiary-fixed": "#fcdeb5",
                    "surface-bright": "#fcf8fa",
                    "on-tertiary-fixed-variant": "#574425",
                    "on-tertiary-fixed": "#271901",
                    "on-primary-fixed": "#131b2e",
                    "outline-variant": "#c6c6cd",
                    "secondary-container": "#d5e3fd",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#bec6e0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "4px",
                    "xs": "4px",
                    "sm": "8px",
                    "gutter": "16px",
                    "margin-desktop": "40px",
                    "margin-mobile": "20px",
                    "lg": "24px",
                    "xl": "32px",
                    "2xl": "48px",
                    "md": "16px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "label-xs": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg-mobile": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "display-lg": ["34px", {"lineHeight": "41px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["22px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["15px", {"lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400"}],
                    "label-xs": ["11px", {"lineHeight": "13px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["17px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #fcf8fa;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ios-shadow {
            box-shadow: 0px 4px 12px rgba(15, 23, 42, 0.03);
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px #3B82F6;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center">
<!-- Top Navigation (Simplified for Transactional Page) -->
<header class="fixed top-0 w-full h-16 flex items-center px-margin-mobile md:px-margin-desktop z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-headline-md text-headline-md text-primary tracking-tight">Traction</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px] px-margin-mobile flex flex-col gap-xl py-2xl">
<!-- Welcome Header -->
<div class="space-y-sm text-center">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface tracking-tight">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Reduce the noise. Reclaim your focus.</p>
</div>
<!-- Login Form -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<div class="space-y-md">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative group">
<input class="w-full h-12 px-md bg-surface-container-low border border-outline-variant/30 rounded-lg font-body-md text-body-md outline-none transition-all focus:border-primary-fixed focus:bg-white focus:ring-1 focus:ring-primary-fixed-dim" id="email" placeholder="alex@traction.ai" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:opacity-70 transition-opacity" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<input class="w-full h-12 px-md bg-surface-container-low border border-outline-variant/30 rounded-lg font-body-md text-body-md outline-none transition-all focus:border-primary-fixed focus:bg-white focus:ring-1 focus:ring-primary-fixed-dim" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-primary text-white rounded-lg font-label-sm text-label-sm font-semibold hover:opacity-90 active:scale-[0.98] transition-all ios-shadow">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-label-xs text-label-xs text-outline uppercase tracking-widest">or continue with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-2 h-12 bg-surface-container-lowest border border-outline-variant/30 rounded-lg font-label-sm text-label-sm hover:bg-surface-variant/50 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">apps</span>
                Apple
            </button>
<button class="flex items-center justify-center gap-2 h-12 bg-surface-container-lowest border border-outline-variant/30 rounded-lg font-label-sm text-label-sm hover:bg-surface-variant/50 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-lg">brand_awareness</span>
                Google
            </button>
</div>
<!-- Footer Link -->
<p class="text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-semibold hover:opacity-70 transition-opacity" href="#">Sign Up</a>
</p>
</main>
<!-- Visual Anchor / Atmosphere -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<!-- Subtle radial gradient for depth -->
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[30%] h-[30%] bg-secondary-fixed/10 blur-[100px] rounded-full"></div>
</div>
<!-- Script for subtle haptic feedback simulation -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });
        
        // Form field focus effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('.space-y-xs').querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('.space-y-xs').querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
</body></html>
