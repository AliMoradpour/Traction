<!-- Navigation Shell Placeholder (Not rendered on transactional screens as per mandate, but included here for shell integrity) -->
<!-- Note: Following the "Destination Rule", the nav bar is suppressed for this transactional "New Goal" screen to prioritize focus -->
<script>
        // Micro-interactions for button active states
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('active-tap');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('active-tap');
            });
            button.addEventListener('mousedown', () => {
                button.classList.add('active-tap');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('active-tap');
            });
        });

        // Simple scroll effect for top app bar
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-sm');
            } else {
                header.classList.remove('shadow-sm');
            }
        });
    </script>
