<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Log in</a>
</div>
</header>
<main class="min-h-screen flex flex-col items-center justify-center pt-24 pb-12 px-margin-mobile">
<!-- Center Focus Container -->
<div class="w-full max-w-[400px] flex flex-col gap-xl">
<!-- Branding/Instruction -->
<div class="text-center space-y-base">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tight">Create your account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Focus on what matters. We'll handle the rest.</p>
</div>
<!-- Social Auth Section -->
<div class="flex flex-col gap-md">

<!-- Manual Registration Form -->

</div>

<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
</div>

</div>
<script>
        // Micro-interaction: Focus effect on form inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#3B82F6';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '#45464D';
            });
        });

        // Simple button haptic simulation
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });
    </script>
